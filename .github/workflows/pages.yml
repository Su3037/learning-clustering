# GitHub Pages deployment for the static course in site/.
# Prepared only: nothing has been pushed. Enable Pages → "GitHub Actions" in the repository settings first.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: node --test tests/engines.test.mjs tests/challenges.test.mjs tests/site.test.mjs
      - run: python3 tests/crosscheck.py
      - run: for d in python/m0*; do python3 "$d/check.py" "$d/reference.py"; done
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
